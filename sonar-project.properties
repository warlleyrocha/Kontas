# Informações do Projeto
sonar.projectKey=kontas
sonar.projectName=Kontas
sonar.projectVersion=1.0.0
sonar.projectDescription=Análise de código do projeto Kontas (Expo/React Native)

# Servidor SonarQube local
sonar.host.url=http://localhost:9000
sonar.token=${env.SONAR_TOKEN}

# Código fonte
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Testes — ADICIONADO
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Cobertura de testes (Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.config.js,**/*.config.ts

# TypeScript específico
sonar.typescript.excludeTypeDefinitionFiles=true
sonar.typescript.tsconfigPath=tsconfig.json

# Exclusões importantes para Expo/React Native
sonar.exclusions=\
  node_modules/**,\
  .expo/**,\
  .expo-shared/**,\
  android/**,\
  ios/**,\
  dist/**,\
  build/**,\
  coverage/**,\
  *.config.js,\
  *.config.ts,\
  babel.config.js,\
  metro.config.js,\
  tailwind.config.js,\
  **/*.d.ts,\
  **/react-native.config.js,\
  **/__mocks__/**,\
  **/assets/**,\
  **/public/**

# Duplicações
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Qualidade
sonar.qualitygate.wait=true