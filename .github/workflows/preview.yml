name: Expo CI

on:
  pull_request:
    branches: [develop]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: expo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:

  quality:
    name: Code Quality

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo doctor
        run: npx expo-doctor

      - name: Expo lint
        run: npm run lint

      - name: Tests coverage
        run: npm run test:coverage


  preview-android:
    name: Android Preview Build

    needs: quality

    if: |
      github.event.action == 'ready_for_review' ||
      (github.event.action == 'opened' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: 1

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          eas-version: latest

      - name: Validate project
        run: npx expo-doctor

      - name: Build Android Preview
        id: build
        run: |
          BUILD=$(eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json \
            2>/dev/null)

          echo "$BUILD"

          BUILD_URL=$(echo $BUILD | jq -r '.[0].buildDetailsPageUrl')
          echo "BUILD_URL=$BUILD_URL" >> $GITHUB_ENV

      - name: Comment build link
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.BUILD_URL;

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const existing = comments.data.find(c =>
              c.body.includes("Android preview build")
            );

            const body = `📱 Android preview build disponível:\n${url}`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }